services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: mecanica_sao_jorge
      MYSQL_USER: mecanica
      MYSQL_PASSWORD: change-me-local
      MYSQL_ROOT_PASSWORD: change-me-root-local
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
