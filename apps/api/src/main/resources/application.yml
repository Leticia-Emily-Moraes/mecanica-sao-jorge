server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: mecanica-sao-jorge-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # ADR-039: instante lido do banco igual em qualquer fuso de JVM.
      data-source-properties:
        connectionTimeZone: UTC
        forceConnectionTimeZoneToSession: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

jwt:
  # ADR-004/ADR-009: sem default utilizavel - a aplicacao falha ao subir sem
  # JWT_SECRET valido (minimo 32 bytes), nunca comitado nem logado.
  secret: ${JWT_SECRET}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:10080}

management:
  endpoints:
    web:
      exposure:
        include: health

# Dado pessoal fora do log (politica de dados do cliente, secao 6; ADR-020): o Hibernate loga a
# mensagem do MySQL, que traz o CPF em "Duplicate entry '<cpf>'". O erro continua tratado e
# registrado pelo handler global, so com a classe da excecao e o caminho.
logging:
  level:
    org.hibernate.orm.jdbc.error: "OFF"
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"
